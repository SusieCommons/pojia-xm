<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小熊猫破甲</title>
<style>
/* ============================================================
   小熊猫破甲 · 前端
   布局：标题栏 / 人格卡 / 客户端清单 / 日志抽屉 / 操作条
   动画只用 transform + opacity，进度条用 scaleX，保证 60fps
   ============================================================ */
:root{
  --bg:#08060c;
  --panel:rgba(255,255,255,.038);
  --panel-2:rgba(255,255,255,.058);
  --line:rgba(255,255,255,.075);
  --line-s:rgba(255,122,80,.55);
  --txt:#f5f0f8;
  --dim:#a49cae;
  --dim2:#6a6275;
  --brand:#ff5c3a;
  --brand2:#ff9a4d;
  --ok:#3ddc97;
  --warn:#f5b942;
  --bad:#ff5470;
  --r:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--txt);
  font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
/* 背景：两团暖光 + 一层极淡的网格，压住大面积纯色的塑料感 */
body::before{
  content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;
  background:
    radial-gradient(42% 34% at 16% -4%,rgba(255,92,58,.20),transparent 64%),
    radial-gradient(36% 30% at 88% 4%,rgba(124,92,255,.14),transparent 62%),
    radial-gradient(48% 36% at 62% 104%,rgba(255,154,77,.09),transparent 66%);
  filter:blur(8px);animation:drift 26s var(--ease) infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(-1.6%,1.4%,0) scale(1.07)}
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(80% 70% at 50% 20%,#000 30%,transparent 100%);
}

.app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:52px 1fr 74px}

/* ---------------- 标题栏 ---------------- */
.titlebar{
  cursor:default;
  display:flex;align-items:center;gap:11px;padding:0 8px 0 16px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
}
.brand{display:flex;align-items:center;gap:10px;pointer-events:none}
.titlebar:active{cursor:grabbing}
.logo{width:28px;height:28px;display:block;border-radius:6px;filter:drop-shadow(0 3px 9px rgba(0,0,0,.55))}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:.4px}
.brand .sep{width:1px;height:14px;background:rgba(255,255,255,.12);margin:0 2px}
.brand span{font-size:10.5px;color:var(--dim2);letter-spacing:.3px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.ver{
  font-size:10px;color:var(--dim2);letter-spacing:.5px;font-variant-numeric:tabular-nums;
  padding:2.5px 8px;border:1px solid var(--line);border-radius:20px;margin-right:8px;
}
.wbtn{
  width:40px;height:32px;border:0;background:transparent;color:var(--dim);
  border-radius:8px;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,color .15s,transform .1s;
}
.wbtn:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.wbtn:active{transform:scale(.92)}
.wbtn.close:hover{background:#e5484d;color:#fff}
.wbtn svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.4;fill:none}

/* ---------------- 主体 ---------------- */
main{
  overflow-y:auto;overflow-x:hidden;padding:18px 22px 6px;
  display:flex;flex-direction:column;gap:16px;
}
main::-webkit-scrollbar{width:10px}
main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.085);border-radius:10px;
  border:3px solid transparent;background-clip:padding-box}
main::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);
  border:3px solid transparent;background-clip:padding-box}

/* ---------------- 人格卡 ---------------- */
.persona{
  position:relative;overflow:hidden;flex:none;
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;border-radius:18px;
  border:1px solid rgba(255,255,255,.09);
  background:
    radial-gradient(120% 160% at 0% 0%,rgba(255,92,58,.16),transparent 58%),
    linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 50px -34px rgba(255,92,58,.9);
}
/* 卡片内部缓慢流动的高光，让大色块不死板 */
.persona::after{
  content:"";position:absolute;inset:-40% -10%;pointer-events:none;
  background:radial-gradient(38% 50% at 30% 40%,rgba(255,180,120,.16),transparent 70%);
  animation:breathe 9s var(--ease) infinite alternate;
}
@keyframes breathe{
  from{transform:translate3d(0,0,0) scale(1);opacity:.75}
  to{transform:translate3d(6%,-4%,0) scale(1.15);opacity:1}
}
.p-avatar{
  width:58px;height:58px;flex:none;border-radius:16px;position:relative;z-index:1;
  display:grid;place-items:center;
  background:transparent;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.95);
}
.p-avatar img{width:100%;height:100%;display:block;border-radius:16px}
.p-main{flex:1;min-width:0;position:relative;z-index:1}
.p-name{
  display:flex;align-items:baseline;gap:9px;
  font-size:19px;font-weight:600;letter-spacing:.5px;
}
.p-name em{
  font-style:normal;font-size:10px;font-weight:500;letter-spacing:.6px;
  color:var(--brand2);border:1px solid rgba(255,154,77,.34);
  background:rgba(255,154,77,.09);padding:1.5px 7px;border-radius:20px;
  vertical-align:2px;
}
.p-tag{
  font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.p-meta{
  display:flex;align-items:center;gap:14px;margin-top:9px;
  font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;
}
.p-meta i{width:3px;height:3px;border-radius:50%;background:var(--dim2);opacity:.6}
.p-meta b{color:var(--dim);font-weight:500}

.p-ring{position:relative;z-index:1;width:84px;height:84px;flex:none;display:grid;place-items:center}
.p-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.p-ring .track{stroke:rgba(255,255,255,.08)}
.p-ring .arc{
  stroke:url(#ringGrad);stroke-linecap:round;
  transition:stroke-dashoffset .7s var(--ease);
}
.p-ring .num{
  font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
  display:flex;align-items:baseline;gap:1px;
}
.p-ring .num s{text-decoration:none;font-size:10px;color:var(--dim2);font-weight:400}
.p-ring .cap{font-size:9.5px;color:var(--dim2);letter-spacing:.4px;margin-top:3px}
.p-ring .stack{display:flex;flex-direction:column;align-items:center;gap:1px}

/* ---------------- 区块标题 ---------------- */
.sec{
  display:flex;align-items:center;gap:8px;flex:none;height:18px;
  font-size:10.5px;letter-spacing:1.6px;color:var(--dim2);text-transform:uppercase;
}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sec .n{letter-spacing:.4px;text-transform:none;color:var(--dim2)}

/* ---------------- 客户端清单 ---------------- */
.list{
  display:flex;flex-direction:column;flex:none;
  animation:listIn .34s var(--ease) both;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:rgba(255,255,255,.022);
}
@keyframes listIn{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
.row{
  position:relative;display:flex;align-items:center;gap:12px;
  height:52px;padding:0 14px 0 12px;cursor:pointer;
  transition:background .18s,opacity .3s;
}
.row.busy{opacity:1}
.row + .row{border-top:1px solid rgba(255,255,255,.05)}
/* 左侧品牌色竖条：选中才亮，未选中是透明的占位 */
.row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--c,var(--brand));opacity:0;transform:scaleY(.4);
  transition:opacity .2s,transform .24s var(--ease);
}
.row:hover{background:rgba(255,255,255,.035)}
.row:hover::before{opacity:.35;transform:none}
.row.sel{background:linear-gradient(90deg,rgba(255,92,58,.10),rgba(255,92,58,.02))}
.row.sel::before{opacity:1;transform:none}
.row.dead{opacity:.45;cursor:not-allowed}
/* 点不了但能修：透明度保留、光标用普通指针，双击走「改目录」 */
.row.dead.fixable{opacity:.72;cursor:pointer}
.row.dead:hover{background:transparent}
.row.dead.fixable:hover{background:rgba(255,255,255,.028)}
.row.dead.fixable:hover .r-check{border-color:rgba(255,255,255,.22)}
.row.dead:hover::before{opacity:0}
.row.busy::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);
  transform:translateX(-100%);animation:sheen 1.15s linear infinite;
}
@keyframes sheen{to{transform:translateX(100%)}}
.row.bad{animation:shake .42s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}40%{transform:translateX(4px)}
  60%{transform:translateX(-2px)}80%{transform:translateX(2px)}
}

.r-ico{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:#fff;letter-spacing:-.4px;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26);
}

/* ---------------- 客户端官方图标 ----------------
   28px 方块 + 6px 圆角，比旧的字符块小两像素 —— 真图标本身有留白，
   尺寸和旧块一样大反而显得「胖」，视觉重量会盖过右侧的客户端名。
   img 铺满是为了让 PNG 自带的圆角背景贴齐容器；矢量图标则在 i-dark
   的黑底上按 62% 居中，四周留出呼吸空间。 */
.i-ico{
  width:28px;height:28px;border-radius:8px;flex:none;overflow:hidden;
  display:grid;place-items:center;
}
.i-ico img{width:100%;height:100%;object-fit:cover;display:block}
.i-ico svg{width:62%;height:62%;display:block}
/* 深底图标：OpenAI 花结本身是白的，放亮底会消失 */
.i-ico.i-dark{background:#0d0d0d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.i-ico.i-dark svg{color:#fff}
/* DeepSeek 认的是那口蓝，不是白 */
.i-ico.i-blue svg{color:#5786fe}
/* 未安装的行整体 .dead 已经降到 45% 透明，图标再压一档会看不清 */
.row.dead .i-ico{filter:saturate(.55)}
.r-name{width:96px;flex:none;display:flex;align-items:center;gap:6px}
.r-name b{font-size:13px;font-weight:600;letter-spacing:.2px}
/* 运行中的小绿点 */
.dot-run{
  width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none;
  animation:pulse 2.2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(61,220,151,.5)}
  70%{box-shadow:0 0 0 5px rgba(61,220,151,0)}
  100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}
}
.r-state{flex:none;display:flex;align-items:center;gap:7px}
.badge{
  font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid transparent;
  letter-spacing:.2px;white-space:nowrap;
  transition:background .25s,color .25s,border-color .25s;
}
.badge.g{background:rgba(61,220,151,.12);color:var(--ok);border-color:rgba(61,220,151,.26)}
.badge.y{background:rgba(245,185,66,.12);color:var(--warn);border-color:rgba(245,185,66,.25)}
.badge.n{background:rgba(255,255,255,.05);color:var(--dim);border-color:var(--line)}
.badge.r{background:rgba(255,84,112,.11);color:var(--bad);border-color:rgba(255,84,112,.25)}
.r-detail{
  flex:1;min-width:0;font-size:10.5px;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:Consolas,ui-monospace,monospace;
}
.r-check{
  width:19px;height:19px;border-radius:50%;flex:none;
  border:1.5px solid rgba(255,255,255,.15);display:grid;place-items:center;
  transition:background .2s,border-color .2s,transform .22s var(--ease);
}
.r-check svg{width:9px;height:9px;stroke:#fff;stroke-width:2.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);
  transition:opacity .16s,transform .24s var(--ease)}
.row.sel .r-check{
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  border-color:transparent;transform:scale(1.05);
}
.row.sel .r-check svg{opacity:1;transform:none}
.row:hover .r-check{border-color:rgba(255,255,255,.32)}
.row.dead .r-check{border-style:dashed;opacity:.5}

/* ---------------- 引流卡 / 更新卡 ----------------
   两张卡共用一套骨架（图标 + 主区 + 右侧按钮），只是左边状态条的配色不同。
   1.2.x 这里是「授权卡」，1.3.0 改成这两张 —— 引流是常驻的，更新是按需出现的。
   视觉上故意做得比人格卡轻：它们是附注，不是主角。 */
.strip{
  display:flex;align-items:center;gap:12px;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.016));
  position:relative;overflow:hidden;flex:0 0 auto;
}
/* 状态色只染左边一条，不整块换底色 —— 整块变色会把上面的品牌区压掉 */
.strip::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;
  background:var(--dim2);transition:background .3s var(--ease);
}
.strip[data-k=ok]::before{background:linear-gradient(180deg,var(--ok),#25b87a)}
.strip[data-k=warn]::before{background:linear-gradient(180deg,var(--warn),#d99b20)}
.strip[data-k=bad]::before{background:linear-gradient(180deg,var(--bad),#c9314c)}
.strip[data-k=brand]::before{background:linear-gradient(180deg,var(--brand2),var(--brand))}

.strip .s-ico{
  width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.055);border:1px solid var(--line);
}
.strip .s-ico svg{width:15px;height:15px;fill:none;stroke:var(--dim);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.strip[data-k=brand] .s-ico{background:rgba(255,92,58,.13);border-color:rgba(255,122,80,.32)}
.strip[data-k=brand] .s-ico svg{stroke:var(--brand2)}
.strip[data-k=ok] .s-ico{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3)}
.strip[data-k=ok] .s-ico svg{stroke:var(--ok)}
.strip[data-k=warn] .s-ico{background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.3)}
.strip[data-k=warn] .s-ico svg{stroke:var(--warn)}
.strip[data-k=bad] .s-ico{background:rgba(255,84,112,.12);border-color:rgba(255,84,112,.3)}
.strip[data-k=bad] .s-ico svg{stroke:var(--bad)}

.strip .s-main{flex:1 1 auto;min-width:0}
.strip .s-t{display:flex;align-items:center;gap:7px;font-size:11.5px}
.strip .s-t b{font-weight:600;letter-spacing:.2px}
.strip .s-t em{
  font-style:normal;font-size:9.5px;letter-spacing:.4px;padding:1.5px 6px;border-radius:20px;
  background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--line);
}
.strip[data-k=brand] .s-t em{background:rgba(255,92,58,.14);color:var(--brand2);
  border-color:rgba(255,122,80,.3)}
.strip[data-k=ok] .s-t em{background:rgba(61,220,151,.13);color:var(--ok);border-color:rgba(61,220,151,.28)}
.strip[data-k=warn] .s-t em{background:rgba(245,185,66,.12);color:var(--warn);
  border-color:rgba(245,185,66,.26)}
.strip[data-k=bad] .s-t em{background:rgba(255,84,112,.12);color:var(--bad);
  border-color:rgba(255,84,112,.26)}

/* 群号：等宽 + 字间距，跟机器码一个观感，抄的时候不会串行 */
.strip .s-code{
  display:flex;align-items:center;gap:6px;margin-top:3px;
  font:10.5px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;
  color:var(--dim2);letter-spacing:.7px;
}
.strip .s-code b{color:var(--dim);font-weight:500;letter-spacing:1.4px}
.strip .s-code button{
  border:0;background:transparent;color:var(--dim2);cursor:pointer;
  padding:0 3px;display:grid;place-items:center;border-radius:4px;
}
.strip .s-code button:hover{color:var(--brand)}
.strip .s-code svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* 更新说明：多行，最多三行，超出省略 —— 后台可能贴一大段 changelog */
.strip .s-notes{
  margin-top:4px;font-size:10.5px;line-height:1.6;color:var(--dim2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;white-space:pre-line;
}

.strip .s-act{display:flex;gap:6px;flex:0 0 auto}
.strip .s-btn{
  height:27px;padding:0 11px;border-radius:8px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--dim);font:11px/1 "Microsoft YaHei UI",sans-serif;transition:.16s var(--ease);
}
.strip .s-btn:hover{background:rgba(255,255,255,.1);color:var(--txt);border-color:rgba(255,255,255,.16)}
.strip .s-btn.pri{
  border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--brand2),var(--brand));
  box-shadow:0 3px 12px rgba(255,92,58,.26);
}
.strip .s-btn.pri:hover{filter:brightness(1.08)}

/* 强制更新：整条描红，视觉上「这事你得处理」。
   不整块染红 —— 那看着像报错崩溃，用户第一反应是关窗口。 */
.strip[data-hard=1]{
  border-color:rgba(255,84,112,.34);
  background:linear-gradient(180deg,rgba(255,84,112,.1),rgba(255,84,112,.03));
}
.strip[data-hard=1] .s-t b{color:#ff8fa3}

/* hidden 必须显式声明。
   UA 样式里的 [hidden]{display:none} 特异性是 (0,1,0)，跟 .strip{(0,1,0)}
   打平，而作者样式表永远排在 UA 后面 —— 结果是 .strip{display:flex} 赢，
   hidden 属性完全不生效。更新卡会一直挂在那儿，明明 has=false。 */
.strip[hidden]{display:none}

/* ---------------- 激活弹窗 ---------------- */
.panel{position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:20px}
.panel.show{display:grid}
.panel-mask{position:absolute;inset:0;background:rgba(4,2,8,.66);backdrop-filter:blur(3px)}
.panel-card{
  position:relative;width:min(520px,100%);border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,122,80,.2);background:#0f0b14;
  box-shadow:0 24px 70px rgba(0,0,0,.72);animation:pop .26s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.panel-head{padding:15px 17px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.panel-head b{font-size:13px;letter-spacing:.2px}
.panel-head p{margin-top:4px;font-size:10.5px;color:var(--dim2);line-height:1.6}
.panel-body{padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.panel-body label{font-size:10.5px;color:var(--dim2);letter-spacing:.4px;display:block;margin-bottom:5px}
.panel-body .box{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:rgba(0,0,0,.4);
}
.panel-body .box code{
  flex:1;min-width:0;font:11.5px/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:1.3px;color:var(--brand2);overflow:hidden;text-overflow:ellipsis;
}
.panel-body textarea{
  width:100%;min-height:74px;resize:vertical;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);
  font:11.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.3px;outline:none;word-break:break-all;
}
.panel-body textarea:focus{border-color:rgba(255,122,80,.5);box-shadow:0 0 0 3px rgba(255,92,58,.09)}
.panel-body textarea::placeholder{color:var(--dim2);opacity:.7}
.panel-tip{font-size:10.5px;color:var(--dim2);line-height:1.7}
.panel-tip b{color:var(--dim);font-weight:500}
.panel-foot{padding:12px 17px 15px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.panel-foot .sp{flex:1}
.panel-foot button{
  height:31px;padding:0 15px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);
  font:11.5px/1 "Microsoft YaHei UI",sans-serif;transition:.16s var(--ease);
}
.panel-foot button:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.panel-foot button.pri{
  border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--brand2),var(--brand));
  box-shadow:0 4px 14px rgba(255,92,58,.3);
}
.panel-foot button.pri:disabled{opacity:.55;cursor:default;box-shadow:none}

/* ---------------- 日志抽屉 ---------------- */
.logbox{
  display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r);
  background:rgba(0,0,0,.34);
  flex:1 1 auto;min-height:34px;   /* 展开时吃掉窗口剩余高度 */
}
.logbox:not(.open){flex:0 0 auto}
.logbox.open{min-height:152px}
.logbar{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 12px;
  cursor:pointer;flex:none;user-select:none;
  transition:background .16s;
}
.logbar:hover{background:rgba(255,255,255,.028)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.logbar .t{font-size:10.5px;letter-spacing:1.2px;color:var(--dim2);margin-left:6px;text-transform:uppercase}
.logbar .last{
  flex:1;min-width:0;font-size:10.5px;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-left:10px;font-family:Consolas,ui-monospace,monospace;
}
.logbar .chev{width:11px;height:11px;stroke:var(--dim2);stroke-width:2;fill:none;
  transition:transform .24s var(--ease);flex:none}
.logbox.open .logbar .chev{transform:rotate(180deg)}
.mini{
  border:0;background:transparent;color:var(--dim2);font-size:10.5px;
  cursor:pointer;padding:3px 7px;border-radius:5px;font-family:inherit;
  transition:background .15s,color .15s;flex:none;
}
.mini:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.console{
  height:0;overflow-y:auto;padding:0 12px;flex:1;
  font:11.5px/1.72 Consolas,"Cascadia Mono",ui-monospace,monospace;
  user-select:text;transition:height .26s var(--ease),padding .26s var(--ease);
}
.logbox.open .console{height:auto;padding:6px 12px 8px}
.console::-webkit-scrollbar{width:9px}
.console::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;
  border:3px solid transparent;background-clip:padding-box}
.line{display:flex;gap:9px;animation:lineIn .22s var(--ease) both}
@keyframes lineIn{from{opacity:0;transform:translate3d(0,3px,0)}to{opacity:1;transform:none}}
.line .tm{color:#4b4457;flex:none;font-variant-numeric:tabular-nums}
.line .m{white-space:pre-wrap;word-break:break-all;min-width:0}
.line.info .m{color:#cac3d4}
.line.dim  .m{color:#6a6275}
.line.ok   .m{color:var(--ok)}
.line.bad  .m{color:var(--bad)}
.line.warn .m{color:var(--warn)}

/* ---------------- 操作条 ---------------- */
footer{
  display:flex;align-items:center;gap:6px;padding:0 22px;
  border-top:1px solid rgba(255,255,255,.05);
  background:linear-gradient(0deg,rgba(255,255,255,.024),transparent);
}
.linkbtn{
  border:0;background:transparent;color:var(--dim2);font-size:11px;
  cursor:pointer;font-family:inherit;padding:6px 9px;border-radius:7px;
  display:flex;align-items:center;gap:6px;
  transition:color .15s,background .15s;
}
.linkbtn:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.linkbtn svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.linkbtn.on{color:var(--ok)}
.wdot{width:5px;height:5px;border-radius:50%;background:var(--dim2);transition:background .2s}
.linkbtn.on .wdot{background:var(--ok);animation:pulse 2s infinite}
footer .sp{flex:1}

.btn-sec{
  height:38px;padding:0 18px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);font:inherit;font-size:12.5px;
  transition:background .18s,border-color .18s,transform .1s,opacity .2s;
}
.btn-sec:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.18)}
.btn-sec:active{transform:scale(.97)}
.btn-sec:disabled{opacity:.32;cursor:not-allowed}

.btn-main{
  position:relative;overflow:hidden;
  height:38px;min-width:152px;padding:0 22px;border-radius:10px;border:0;
  cursor:pointer;font:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,#ff5c3a,#ff8a3d 58%,#ffa85c);
  box-shadow:0 10px 26px -12px rgba(255,92,58,.95),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .12s var(--ease),box-shadow .25s,filter .2s;
}
.btn-main:hover{box-shadow:0 14px 34px -12px rgba(255,92,58,1),inset 0 1px 0 rgba(255,255,255,.34);
  filter:brightness(1.06)}
.btn-main:active{transform:scale(.975)}
.btn-main:disabled{
  cursor:not-allowed;color:rgba(255,255,255,.62);
  /* 只降亮度不够：橙色渐变即便压到 0.8 也还是「暖色高亮」，看着能点。
     直接换成灰底描边，跟 sec 按钮同一族，一眼就知道现在按不动。 */
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  box-shadow:none;
}
.btn-main:disabled .bm-txt svg{opacity:.55}
.btn-main .bm-txt{position:relative;z-index:2;display:inline-flex;align-items:center;gap:7px}
.btn-main .bm-txt svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.bm-fill{
  position:absolute;left:0;top:0;bottom:0;width:100%;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,.12));
  transform:scaleX(0);transform-origin:left center;
  transition:transform .35s var(--ease);
}
.btn-main::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);
  transform:translateX(-120%);
}
.btn-main:hover:not(:disabled)::after{animation:sweep .75s var(--ease)}
@keyframes sweep{to{transform:translateX(120%)}}

/* ---------------- 提示 ---------------- */
.toast{
  position:fixed;left:50%;top:62px;z-index:60;
  transform:translate3d(-50%,-14px,0);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:11px;
  font-size:12px;letter-spacing:.2px;
  background:rgba(24,20,30,.95);backdrop-filter:blur(14px);
  border:1px solid rgba(61,220,151,.34);
  box-shadow:0 18px 44px -18px rgba(0,0,0,.9),0 0 0 1px rgba(61,220,151,.1);
  transition:opacity .3s var(--ease),transform .34s var(--ease);
}
.toast.show{opacity:1;transform:translate3d(-50%,0,0)}
.toast .ti{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(61,220,151,.16)}
.toast .ti svg{width:10px;height:10px;stroke:var(--ok);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.toast.err{border-color:rgba(255,84,112,.38);
  box-shadow:0 18px 44px -18px rgba(0,0,0,.9),0 0 0 1px rgba(255,84,112,.12)}
.toast.err .ti{background:rgba(255,84,112,.16)}
.toast.err .ti svg{stroke:var(--bad)}

.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 40%,rgba(61,220,151,.15) 50%,transparent 60%);
  transform:translateX(-100%)}
.flash.go{animation:flashGo 1s var(--ease)}
@keyframes flashGo{0%{opacity:1;transform:translateX(-100%)}100%{opacity:0;transform:translateX(100%)}}
#fx{position:fixed;inset:0;z-index:35;pointer-events:none}

/* ---------------- 备份面板 ---------------- */
.modal{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;
  background:rgba(6,4,9,.62);backdrop-filter:blur(5px);
}
.modal.show{display:grid}
.modal-card{
  width:min(580px,88vw);max-height:min(540px,78vh);
  display:flex;flex-direction:column;overflow:hidden;
  background:#17121d;border:1px solid rgba(255,255,255,.12);border-radius:16px;
  box-shadow:0 44px 96px -34px #000,inset 0 1px 0 rgba(255,255,255,.06);
}
.modal.show .modal-card{animation:modalIn .26s var(--ease)}
@keyframes modalIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:none}
}
.modal-head{display:flex;align-items:center;gap:10px;flex:none;
  padding:16px 16px 13px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.modal-head b{font-size:14px;font-weight:600}
.modal-head span{font-size:11px;color:var(--dim2)}
.modal-head .sp{flex:1}
.modal-body{overflow-y:auto;padding:8px}
.modal-body::-webkit-scrollbar{width:9px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:9px;
  border:3px solid transparent;background-clip:padding-box}
.bk-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  transition:background .16s}
.bk-row:hover{background:rgba(255,255,255,.045)}
.bk-i{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
.bk-i svg{width:14px;height:14px;stroke:var(--dim);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.bk-main{flex:1;min-width:0}
.bk-time{font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.bk-meta{font-size:10.5px;color:var(--dim2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-btn{flex:none;height:28px;padding:0 13px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
  font:inherit;font-size:11.5px;white-space:nowrap;
  transition:background .16s,border-color .16s,color .16s}
.bk-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.bk-btn.arm{background:rgba(255,84,112,.16);border-color:rgba(255,84,112,.5);color:#ff8fa0}
.bk-btn:disabled{opacity:.5;cursor:default}
.bk-empty{text-align:center;padding:36px 0;color:var(--dim2);font-size:12px}
.modal-foot{flex:none;display:flex;justify-content:flex-end;gap:8px;
  padding:10px 14px;border-top:1px solid rgba(255,255,255,.06)}

@media (max-width:900px){
  .p-tag{display:none}
  .r-name{width:78px}
  .persona{padding:14px 16px;gap:13px}
  .p-avatar{width:46px;height:46px;border-radius:13px}
  .p-name{font-size:17px}
  .p-meta{gap:10px;font-size:10.5px}
  .p-ring{width:70px;height:70px}
  .p-ring .num{font-size:15px}
  .btn-sec{padding:0 14px}
  .btn-main{min-width:132px;padding:0 18px}
}

/* ---------------- 使用前须知 ----------------
   加载即出现，盖满整个窗口，没有关闭入口 —— 只有「同意」和「退出」。
   未接受时下层 DOM 全部 inert，键盘焦点也进不去。 */
.consent{
  position:fixed;inset:0;z-index:200;display:none;
  place-items:center;padding:26px 18px;
  background:radial-gradient(60% 50% at 50% 0%,rgba(255,92,58,.16),transparent 70%),#07050a;
}
.consent.show{display:grid}
.consent-card{
  width:min(720px,94vw);max-height:calc(100vh - 52px);
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:18px;border:1px solid rgba(255,255,255,.11);
  background:linear-gradient(180deg,#1a1421,#120e18);
  box-shadow:0 50px 110px -40px #000,inset 0 1px 0 rgba(255,255,255,.07);
  animation:consentIn .32s var(--ease);
}
@keyframes consentIn{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:none}
}
.consent-head{
  flex:none;padding:20px 24px 15px;
  border-bottom:1px solid rgba(255,255,255,.075);
  background:linear-gradient(120deg,rgba(255,92,58,.13),transparent 62%);
}
.consent-head .ttl{display:flex;align-items:center;gap:10px}
.consent-head .ttl svg{width:20px;height:20px;flex:none;
  stroke:var(--warn);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.consent-head b{font-size:15.5px;font-weight:600;letter-spacing:.4px}
.consent-head p{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.65}
.consent-body{
  flex:1;min-height:0;overflow-y:auto;padding:16px 24px 6px;
  font-size:12px;line-height:1.78;color:#cfc8d8;
}
.consent-body::-webkit-scrollbar{width:9px}
.consent-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px;
  border:3px solid transparent;background-clip:padding-box}
.consent-sec{margin-bottom:15px}
.consent-sec:last-child{margin-bottom:4px}
.consent-sec h4{
  font-size:12px;font-weight:600;color:var(--txt);
  display:flex;align-items:center;gap:7px;margin-bottom:6px;
}
.consent-sec h4 i{
  width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:9.5px;font-style:normal;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.consent-sec.hot h4{color:#ffb08a}
.consent-sec.hot h4 i{background:rgba(255,92,58,.18);
  border-color:rgba(255,92,58,.36);color:#ffa07a}
.consent-sec.hot p{color:#e6d3cc}
.consent-sec p{margin:0 0 5px 24px;text-indent:0}
.consent-sec p:last-child{margin-bottom:0}
.consent-foot{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:14px 20px 15px;border-top:1px solid rgba(255,255,255,.075);
  background:rgba(255,255,255,.018);
}
.consent-foot .tip{
  flex:1;font-size:10.5px;color:var(--dim2);line-height:1.5;
}
.cbtn{
  flex:none;height:35px;padding:0 20px;border-radius:9px;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
  transition:background .16s,border-color .16s,transform .1s,filter .2s;
}
.cbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.cbtn:active{transform:scale(.975)}
.cbtn:disabled{cursor:default;opacity:.45}
.cbtn.ok{
  border:0;color:#fff;
  background:linear-gradient(135deg,#ff5c3a,#ff8a3d 60%,#ffa85c);
  box-shadow:0 10px 26px -13px rgba(255,92,58,.95),inset 0 1px 0 rgba(255,255,255,.3);
}
.cbtn.ok:hover{filter:brightness(1.07)}
.cbtn.ok:disabled{filter:saturate(.4) brightness(.72);box-shadow:none}
.cbtn.arm{
  background:rgba(255,84,112,.16);border-color:rgba(255,84,112,.5);color:#ff8fa0;
}
@keyframes agreePop{
  0%{transform:scale(1)}
  45%{transform:scale(1.045)}
  100%{transform:scale(1)}
}
@media (max-width:760px){
  .consent{padding:14px 10px}
  .consent-head{padding:16px 16px 12px}
  .consent-body{padding:13px 16px 4px;font-size:11.5px}
  .consent-sec p{margin-left:0}
  .consent-foot{flex-wrap:wrap;padding:12px 14px}
  .consent-foot .tip{flex-basis:100%;order:3;margin-top:2px}
  .cbtn{flex:1}
}
@media (max-height:680px){
  main{padding-top:14px;gap:12px}
  .logbox.open{min-height:120px}
}
</style>
</head>
<body>
<!-- 使用前须知：默认就要显示（后端回信的 consent.accepted 为 false 时，
     前端立刻盖上；接受过则 JS 把它摘掉）。放在最前面是为了层级干净。 -->
<div class="consent" id="consent">
  <div class="consent-card">
    <div class="consent-head">
      <div class="ttl">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l7.5 3.2v5.6c0 4.4-3.1 8.2-7.5 9.4-4.4-1.2-7.5-5-7.5-9.4V6.2z"/>
          <path d="M12 8.6v4.1M12 15.9v.1"/>
        </svg>
        <b>使用前须知</b>
      </div>
      <p>本工具会修改本机 AI 客户端的配置文件。继续之前请完整阅读以下条款——
         只有明确同意才能使用，不同意请直接退出。</p>
    </div>
    <div class="consent-body" id="consentBody"></div>
    <div class="consent-foot">
      <div class="tip" id="consentTip">点击「同意并继续」即表示你已阅读并接受全部条款</div>
      <button class="cbtn" id="btnDisagree">不同意，退出</button>
      <button class="cbtn ok" id="btnAgree" disabled>同意并继续</button>
    </div>
  </div>
</div>

<div class="app">

/* 序号用中文数字，标题条更整洁 */
const CN_NUM=["一","二","三","四","五","六","七","八","九","十"];

/* 「禁止用途」这一节的视觉加重：红边 + 红字，扫一眼就知道哪条最要紧 */
const HOT_SEC = /禁止|违法|犯罪/;

function renderConsent(sections){
  const box=$("#consentBody");
  if(!sections||!sections.length){
    box.innerHTML='<div class="bk-empty">条款内容缺失，无法使用</div>';
    return;
  }
  box.innerHTML=sections.map((s,i)=>{
    const [head,paras]=s;
    const hot=HOT_SEC.test(head);
    return `<div class="consent-sec${hot?" hot":""}">
      <h4><i>${CN_NUM[i]||i+1}</i>${esc(head)}</h4>
      ${(paras||[]).map(p=>`<p>${esc(p)}</p>`).join("")}
    </div>`;
  }).join("");
  // 内容不够长、不需要滚动时直接放行，否则用户会盯着一个永远点不动的按钮
  requestAnimationFrame(()=>checkConsentScroll(true));
}

/* 必须滑到底才解锁「同意」——挡住一路盲点 */
let consentUnlocked=false;
function checkConsentScroll(force){
  const box=$("#consentBody"), btn=$("#btnAgree");
  if(consentUnlocked) return;
  const reach = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
  if(reach||force&&box.scrollHeight<=box.clientHeight+4){
    consentUnlocked=true;
    btn.disabled=false;
    $("#consentTip").textContent="已读到底 · 点击「同意并继续」表示接受全部条款";
    btn.style.animation="agreePop .36s var(--ease)";
  }else if(!consentUnlocked){
    btn.disabled=true;
    const left=Math.max(0,Math.round(box.scrollHeight-box.scrollTop-box.clientHeight));
    $("#consentTip").textContent="请向下滑动阅读到底（还剩约 "+left+" px）";
  }
}

function openConsent(sections){
  renderConsent(sections);
  consentUnlocked=false;
  $("#btnAgree").disabled=true;
  $("#btnAgree").style.animation="";
  $("#consent").classList.add("show");
  // 面板盖住时下层不能操作，也不能被 Tab 聚焦
  document.querySelector(".app").setAttribute("inert","");
  document.querySelector(".app").setAttribute("aria-hidden","true");
  $("#consentBody").scrollTop=0;
  setTimeout(()=>checkConsentScroll(true),60);
}

function closeConsent(){
  $("#consent").classList.remove("show");
  const app=document.querySelector(".app");
  app.removeAttribute("inert");
  app.removeAttribute("aria-hidden");
}

async function doAgree(){
  $("#btnAgree").disabled=true;
  let r=null;
  try{ r=await api.agree(); }
  catch(e){ r={ok:false,msg:String(e&&e.message||e)}; }
  if(!r||!r.ok){
    $("#btnAgree").disabled=false;
    toast((r&&r.msg)||"记录失败，重试一次",true);
    return;
  }
  closeConsent();
  log("dim","已接受使用条款");
  scan(true);
  loadWatch();
}

async function doDisagree(){
  const b=$("#btnDisagree");
  if(!b.classList.contains("arm")){
    b.classList.add("arm"); b.textContent="确认退出？";
    clearTimeout(b._t);
    b._t=setTimeout(()=>{ b.classList.remove("arm"); b.textContent="不同意，退出"; },3000);
    return;
  }
  b.disabled=true; b.textContent="退出中…";
  try{ await api.disagree(); }catch(e){}
}

/* 已经提示过的版本验签失败原因。轮询会反复调 paintUpdate，同一句只报一次。 */
let updTamperShown = "";
/* 强制更新时置 true。apply / verify / revert / 守护全都看它。 */
let HARD = false;

function paintBrand(b){
  if(!b) return;
  GRP = Object.assign(GRP, b);
  $("#grpName").textContent = GRP.name || "小熊猫交流群";
  $("#grpNo").textContent = GRP.group || "100000000";
  const tip = [];
  if(GRP.tip) tip.push(GRP.tip);
  if(GRP.src === "remote") tip.push("（服务端下发，已验签）");
  if(GRP.bad && GRP.bad.length) tip.push("配置异常");
  if(GRP.tamper) tip.push("引流内容校验失败：" + GRP.tamper);
  $("#grp").title = tip.join(" · ");

  // 两种情况都标红，但文案不同，因为处理方式不同：
  //   bad    —— exe 里的内置常量被改过（有人改了重打包），说明这不是原版。
  //   tamper —— 服务端下发的内容验签没过（中间人 / 缓存被改 / 服务端私钥不对）。
  //             这时群号已经是内置默认值，没有用别人的号，但用户该知道。
  if(GRP.bad && GRP.bad.length){
    $("#grp").dataset.k = "bad";
    $("#grpName").textContent = "引流信息被改动";
  }else if(GRP.tamper){
    $("#grp").dataset.k = "bad";
    $("#grpName").textContent = (GRP.name || "小熊猫交流群") + "（已回退默认）";
  }
}

function fmtSize(n){
  n = Number(n)||0;
  if(n <= 0) return "";
  if(n >= 1048576) return (n/1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n/1024)) + " KB";
}

function paintUpdate(u){
  if(!u) return;
  UPD = Object.assign({}, UPD, u);
  const card = $("#upd");

  // pending 有两种情况：真的还没查到；或者刚塞了缓存占位。
  // 两种都不该改动锁状态 —— 已经锁上的不能因为「正在查」而解锁。
  if(UPD.pending){
    return;
  }

  if(!UPD.has){
    card.hidden = true;
    // 服务端明确说没有新版（或查失败放行）才解锁
    setHard(false);
    // 版本响应验签失败：卡片不显示（不敢让用户照它去下载），但必须留一条
    // 可见痕迹 —— 静默隐藏会让「有人在中间改更新地址」变成完全无声。
    // 同一条原因只提示一次：轮询会反复调 paintUpdate，不去重就是刷屏。
    if(UPD.tamper && UPD.tamper !== updTamperShown){
      updTamperShown = UPD.tamper;
      toast("更新信息校验失败，已忽略：" + UPD.tamper, true);
    }
    return;
  }
  card.hidden = false;
  HARD = !!UPD.force;
  setHard(HARD);

  card.dataset.k = HARD ? "bad" : "warn";
  card.dataset.hard = HARD ? "1" : "0";
  $("#updTitle").textContent = HARD
    ? ("必须更新到 " + (UPD.ver||"新版"))
    : ("发现新版本 " + (UPD.ver||""));
  $("#updTag").textContent = HARD ? "强制更新" : "可选更新";

  const bits = [];
  if(UPD.notes) bits.push(UPD.notes);
  const sz = fmtSize(UPD.size);
  if(sz) bits.push("安装包 " + sz);
  if(UPD.sha256) bits.push("SHA-256 " + UPD.sha256.slice(0,16) + "…");
  if(UPD.err) bits.push("（" + UPD.err + "，显示的是上次查到的结果）");
  const notes = $("#updNotes");
  if(bits.length){
    notes.textContent = bits.join("\n");
    notes.hidden = false;
  }else{
    notes.hidden = true;
  }

  // 强制更新不给「稍后」—— 留着这个按钮等于给了个点了没用的假出口。
  $("#btnUpdLater").hidden = HARD;
  $("#btnUpdGo").textContent = HARD ? "立即更新（必须）" : "立即更新";
}

/* 强制更新时把三个动作按钮一起锁掉。
   跟旧的授权闸门走同一个汇合点（app[data-licensed]），因为 syncButtons()
   已经在读它 —— 多开一个 data 属性会让两个闸门互相覆盖。 */
function setHard(on){
  const app = document.querySelector(".app");
  const want = on ? "0" : "1";
  if(app.dataset.licensed === want) return;
  app.dataset.licensed = want;
  syncButtons();
}

/* 能不能干活：1.3.0 只看强制更新。 */
function canWork(){ return !HARD; }

async function copyBrand(){
  const txt = GRP.line || ("小熊猫交流群 " + (GRP.group||"100000000"));
  let r = null;
  try{ r = await api.copy_text(txt); }
  catch(e){ r = {ok:false,msg:"复制失败"}; }
  if(r && r.ok){ toast(r.msg || "群号已复制"); return; }
  // 后端剪贴板被占时退回浏览器 API
  try{ await navigator.clipboard.writeText(txt); toast("群号已复制"); }
  catch(e){ toast((r&&r.msg)||"复制失败，手动记一下：" + txt, true); }
}

async function joinGroup(){
  if(!GRP.url){ toast("加群链接缺失", true); return; }
  let ok = false;
  try{ ok = await api.open_url(GRP.url); }catch(e){}
  if(!ok){
    // 打不开浏览器就把群号亮出来，用户还能自己搜
    toast("请手动加群：" + (GRP.line||""), true);
  }
}

async function doUpdate(){
  const b = $("#btnUpdGo");
  const old = b.textContent;
  b.disabled = true; b.textContent = "打开下载页…";
  let ok = false;
  try{ ok = await api.open_url(UPD.url); }catch(e){}
  b.disabled = false; b.textContent = old;
  if(ok){
    toast("已打开下载页，下完点「校验文件」核对一遍再运行");
    log("info", "已打开 " + (UPD.ver||"新版") + " 下载页");
  }else{
    toast("打不开浏览器 · 地址 " + (UPD.url||"缺失"), true);
  }
}

/* 下载完之后核对字节。

   前面所有签名校验保护的是「服务端告诉你的下载地址和哈希」；这个函数保护
   的是「你手里那个文件」。两段都做才算闭环 —— 只有前者的话，中间人在下载
   环节替换文件，用户看到的仍是真实提示、真实哈希，只是文件是假的。

   期望哈希由后端从已验签的 _UPD 取，前端传不了。 */
async function doVerify(){
  const b = $("#btnUpdVerify");
  const old = b.textContent;
  b.disabled = true; b.textContent = "校验中…";
  let r = null;
  try{ r = await api.verify_file(); }
  catch(e){ r = {ok:false, msg:"校验调用失败：" + (e && e.message || e)}; }
  b.disabled = false; b.textContent = old;

  if(!r) return;
  if(r.msg === "取消了"){ return; }          // 用户主动取消，不弹提示
  if(r.ok){
    toast(r.msg);
    log("info", "安装包校验通过 · " + (r.name||"") + " · " + (r.sha256||"").slice(0,16) + "…");
    return;
  }
  // 不通过要说清三件事：哪个文件、实际哈希、期望哈希。
  // 只说「校验失败」用户会反复重试同一个坏文件。
  toast(r.msg, true);
  log("bad", "安装包校验失败 · " + (r.name||""));
  if(r.sha256) log("bad", "  实际 " + r.sha256);
  if(r.want)   log("bad", "  期望 " + r.want);
}

/* 启动后取一次后台预热的结果。没跑完就再等一轮。

   预算按墙钟算而不是按次数：服务端超时是 4 秒，DNS 卡住可能更久，
   按「16 次 × 500ms」这种固定次数算，慢网络下轮询会在结果到达前收工，
   横幅永远不出来。给 12 秒，超时了用最后拿到的缓存值画一次（至少能
   显示「上次已知有新版」），然后收工。 */
const UPD_DEADLINE = 12000;
let updTries = 0;
const updT0 = Date.now();
let updLast = null;

async function pollUpdate(){
  let r = null;
  try{ r = await api.update_poll(); }catch(e){ return; }
  if(!r) return;
  if(!r.pending) updLast = r;
  if(r.pending && Date.now() - updT0 < UPD_DEADLINE){
    updTries++;
    setTimeout(pollUpdate, 500);
    return;
  }
  if(r.pending){
    // 超时：还有缓存值就画出来，别让界面一片空白
    if(updLast) paintUpdate(updLast);
  }else{
    paintUpdate(r);
  }
  // 更新轮询收工 = 启动后台那一串网络请求基本都回来了。顺势把引流内容
  // 重取一次：brand_warm() 是另起线程的，它可能比版本检查慢一点点，
  // 首屏画的是内置默认值，这时候补一次就能显示后台配的群。
  refreshBrand();
}

/* 只重取引流内容，不动扫描结果 —— 扫一遍要几百毫秒，为了改一行群名
   重扫全部靶点不值当。失败静默：引流卡保持原样最差也就是显示默认值。 */
let brandReq = 0;
async function refreshBrand(){
  if(!api.brand) return;
  const my = ++brandReq;
  let b = null;
  try{ b = await api.brand(); }catch(e){ return; }
  if(!b || my !== brandReq) return;   // 有更新的请求在跑，丢掉这次结果
  paintBrand(b);
}

async function checkUpdate(){
  const b = $("#btnUpdGo");
  toast("正在检查更新…");
  let r = null;
  try{ r = await api.update_now(); }
  catch(e){ r = {has:false,err:String(e&&e.message||e)}; }
  if(!r){ toast("检查失败", true); return; }
  if(r.err){ toast("检查失败：" + r.err, true); }
  paintUpdate(Object.assign({}, r, {pending:false}));
  if(r.has){
    log("info", "发现新版 " + r.ver + (r.force ? "（强制）" : ""));
  }else if(!r.err){
    toast("已是最新版");
  }
}

/* ============================================================
   1. 状态
   ============================================================ */
const S = {
  targets:[], picked:new Set(), busy:false,
  logCursor:0, progress:0, stage:"", version:"1.2.2",
  watchOn:false, watchLast:"", stats:{installed:0,injected:0,todo:0,files:0,targets:0,running:0},
  /* 条款正文缓存。boot() 拿回来存这儿，run() 被 need_consent 拦下时
     直接用它重开面板，不必再跑一次全目标探测。 */
  consentSections:[],
};

/* ============================================================
   2. 日志
   ============================================================ */
const cons = $("#console");
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function log(level,text){
  const row=el("div","line "+level);
  const t=el("span","tm"); t.textContent=stamp();
  const m=el("span","m"); m.textContent=text;
  row.append(t,m);
  cons.appendChild(row);
  while(cons.childElementCount>800) cons.removeChild(cons.firstElementChild);
  cons.scrollTop=cons.scrollHeight;
  $("#logLast").textContent=text;
}

/* ============================================================
   3. 渲染
   ============================================================ */
const BADGE = {
  ready:["y","待破甲"], injected:["g","已破甲"], partial:["y","部分"],
  unsupported:["n","不支持"], absent:["n","未安装"], error:["r","异常"],
};

function rowHtml(t){
  const c=BRAND[t.name]||["#666","#444","?"];
  const [cls,label]=BADGE[t.state]||["n",t.state||"未知"];
  // 几种「没起来」的样子要分清楚，给的操作也不一样：
  //   没选过     → 双击指定目录
  //   选了没用   → 双击换一个 + 能撤销（即使自动探测另外找到了客户端，
  //                也要说 —— 否则用户以为自己选的目录生效了，实际一直在
  //                写自动探测的那个）
  //   装了没靶点 → 双击改目录
  //   选了能用   → 显示那个路径
  let det;
  if(t.state==="unsupported"){
    det = (t.detail||"没有可写的靶点") + " · 双击改目录";
  }else if(t.manual_bad){
    // 放在 installed 前面：手动目录被拒但自动探测命中的情况，最该说的是
    // 「你选的目录没用」，而不是安静地显示自动探测的那个路径。
    det = t.manual_bad;
  }else if(t.installed){
    det = t.path || t.detail || "";
  }else if(t.manual){
    det = "指定的目录用不了 · 双击换一个";
  }else{
    det = "未安装 · 双击指定目录";
  }
  if(t.installed && t.total) det += `  ·  ${t.injected}/${t.total}`;
  return `<div class="row" data-name="${esc(t.name)}" style="--c:${c[0]}">
    ${ICON[t.name]||`<div class="r-ico" style="background:linear-gradient(135deg,${c[0]},${c[1]})">?</div>`}
    <div class="r-name"><b>${esc(t.label)}</b>${t.running?'<i class="dot-run" title="正在运行"></i>':''}</div>
    <div class="r-state"><span class="badge ${cls}">${label}</span></div>
    <div class="r-detail">${esc(det)}</div>
    <div class="r-check"><svg viewBox="0 0 12 12"><path d="M2 6.3l2.6 2.6L10 3.5"/></svg></div>
  </div>`;
}

function renderList(){
  const box=$("#list");
  box.innerHTML="";
  if(!S.targets.length){ box.innerHTML='<div class="bk-empty">没有可显示的客户端</div>'; return; }
  S.targets.forEach((t,i)=>{
    const wrap=document.createElement("div");
    wrap.innerHTML=rowHtml(t);
    const row=wrap.firstElementChild;
    box.appendChild(row);
    paintRow(row,t);
    row.addEventListener("click",()=>toggle(t,row));
    row.title = t.state==="unsupported"
      ? "双击换一个目录"
      : (t.path ? "双击打开 "+t.path :
        (t.manual_bad || t.manual ? "双击重新指定目录（右键可忘记）" : "双击指定安装目录"));
    row.addEventListener("dblclick",e=>{
      e.preventDefault();
      // 没靶点的（unsupported）：双击是「换个目录」——打开目录对他没用，
      // 他缺的是能写的靶点，不是想看那个文件夹长什么样。
      if(t.state==="unsupported") pickDir(t);
      else if(t.path) api.open_path&&api.open_path(t.path);
      else pickDir(t);
    });
    // 右键 = 忘记手动目录。这个动作不常用，占一行按钮反而乱，
    // 藏在右键里刚好 —— 而且只有真记过目录的目标才给。
    row.addEventListener("contextmenu",e=>{
      if(!t.manual) return;
      e.preventDefault();
      forgetDir(t,row);
    });
  });
}

function paintRow(row,t){
  const [cls,label]=BADGE[t.state]||["n",t.state||"未知"];
  const b=row.querySelector(".badge");
  b.className="badge "+cls; b.textContent=label;
  row.classList.toggle("dead",!t.injectable);
  // 不能注入但能修（比如装了却没靶点、或者手动目录失效）时，别把光标
  // 画成禁止符号 —— 双击改目录是这类行唯一有用的动作。
  row.classList.toggle("fixable",!t.injectable && (t.state==="unsupported" || !t.installed));
  row.classList.toggle("sel",S.picked.has(t.name)&&t.injectable);
}

function renderPersona(p,st){
  if(p){
    $("#pName").textContent=p.name||"小熊猫";
    let tag = p.tag || "";
    if(tag.length > 46) tag = tag.slice(0, 46).replace(/[，,、]$/, "") + "…";
    $("#pTag").textContent = tag;
    $("#pSize").textContent=(p.size||0).toLocaleString();
    const ts = p.last ? p.last.slice(5, 16) : "";
    $("#pLast").textContent = ts ? ("最近注入 " + ts) : "尚未注入";
  }
  if(st){
    S.stats=st;
    const done=st.injected||0, all=st.installed||0;
    $("#ringNum").textContent=done;
    $("#ringAll").textContent="/"+all;
    const C=2*Math.PI*34;
    $("#ringArc").style.strokeDashoffset = String(C*(1-(all?done/all:0)));
    $("#pFiles").textContent=st.files||0;
    $("#pTargets").textContent=st.targets||0;
    $("#secNote").textContent = all?`${all} 个客户端 · ${st.targets} 个靶点`:"";
  }
}

function toggle(t,row){
  if(S.busy||!t.injectable) return;
  if(S.picked.has(t.name)){ S.picked.delete(t.name); row.classList.remove("sel"); }
  else { S.picked.add(t.name); row.classList.add("sel"); }
  syncButtons();
}

function syncButtons(){
  const n=S.picked.size;
  // 强制更新期间三个动作按钮全灰。这不只是视觉提示 —— 后端 _start() 里
  // 还有一道闸门，前端只是把「点了会失败」提前说清楚。
  const gate = canWork();
  $("#btnApply").disabled=S.busy||n===0||!gate;
  $("#btnRevert").disabled=S.busy||n===0||!gate;
  $("#btnVerify").disabled=S.busy||!gate;
  const txt=$("#bmTxt");
  const icon='<svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11l-1 8.5 9-12h-6.5z"/></svg>';
  let label;
  if(!gate){
    label = "先更新到 " + (UPD.ver || "新版");
  }
  else if(S.busy)         label = `${S.stage||"处理中"} ${Math.round(S.progress)}%`;
  else if(n > 1)          label = `破甲 ${n} 个`;
  else if(n === 1)        label = "一键破甲";
  else if(S.stats.installed && S.stats.injected >= S.stats.installed) label = "全部就绪";
  else                    label = "一键破甲";
  txt.innerHTML = icon + label;
  $("#fill").style.transform="scaleX("+(S.busy?S.progress/100:0)+")";
}

/* ============================================================
   4. 扫描
   ============================================================ */
async function scan(initial){
  if(S.busy) return;
  if(initial){
    $("#list").innerHTML='<div class="bk-empty">正在扫描…</div>';
    $("#secNote").textContent="";
  }
  try{
    const r = initial? await api.boot() : await api.rescan();
    S.version=r.version||S.version;
    $("#ver").textContent="v"+S.version.split(" ")[0];

    // 条款闸门：后端说没同意就留面板，主界面锁死。
    // 只在首次进入判断 —— 中途 rescan 不再重复弹。
    if(initial && r.consent){
      /* 把条款正文留在 S 里：后面 run() 被 need_consent 拦下时要重新把面板
         显示出来，那时候不该再跑一次 boot()。 */
      if(r.consent.sections) S.consentSections=r.consent.sections;
      if(r.consent.accepted){
        closeConsent();
        log("dim","条款已于 "+(r.consent.at||"").slice(5,16)+" 接受");
      }else{
        openConsent(r.consent.sections||[]);
        $("#list").innerHTML='<div class="bk-empty">请先接受使用条款</div>';
        return;
      }
    }

    S.targets=r.targets||[];
    if(initial){
      S.picked.clear();
      // 默认勾上「还没弄完的」。只认 state!=="injected" 会漏掉 partial ——
      // 4 个靶点注了 2 个也是没弄完，但它的 state 不是 injected，
      // 那种情况恰好会被勾上；真正会漏的是另一种：state=injected 但
      // 用户后来动了配置文件。所以这里再看一眼 injected/total。
      S.targets.forEach(t=>{
        if(!t.injectable) return;
        if(t.state==="injected" && t.total && t.injected >= t.total) return;
        S.picked.add(t.name);
      });
    }
    // 重扫之后可能有的目标变成「已破甲」，那些就不该继续留在选中集合里 ——
    // 留着的话主按钮显示「破甲 4 个」，其中 3 个其实什么都不用做
    S.picked.forEach(n=>{
      const t=S.targets.find(x=>x.name===n);
      if(!t||!t.injectable) S.picked.delete(n);
      else if(t.state==="injected" && t.total && t.injected>=t.total) S.picked.delete(n);
    });
    renderList();
    renderPersona(r.persona, r.stats);
    if(r.brand) paintBrand(r.brand);
    if(initial){
      if(r.update) paintUpdate(r.update);
      if(r.blocked) setHard(true);
      log("dim","小熊猫破甲 "+S.version);
      const st=S.stats;
      log("info",`${st.installed} 个客户端 · ${st.injected} 个已破甲`+
                (st.todo?`，${st.todo} 个待处理`:""));
    }else{
      log("dim","重新扫描完成");
    }
  }catch(e){
    $("#list").innerHTML='<div class="bk-empty">扫描失败，点右上角重试</div>';
    log("bad","扫描失败："+(e&&e.message||e));
  }finally{ syncButtons(); }
}

/* ============================================================
   5. 执行
   ============================================================ */
async function run(mode){
  if(S.busy||!S.picked.size) return;
  // 门禁再判一次。按钮是 disabled 的，但快捷键和脚本调用不走按钮状态。
  if(!canWork()){ toast("先更新到 "+UPD.ver+" 才能用", true); return; }
  const names=[...S.picked];
  S.busy=true; S.progress=0; S.stage="准备中";
  /* 后端每次 _claim() 都会把日志序号归零重新计数，前端游标必须一起归零。
     不归零的话第二轮开始 L.i(从 0 起) 永远小于上一轮留下的 S.logCursor，
     整轮日志被判定为「已显示过」全部吞掉 —— 界面上看就是点了没反应。 */
  S.logCursor=0;
  $("#logbox").classList.add("open");
  syncButtons();
  document.querySelectorAll(".row").forEach(r=>{
    if(names.includes(r.dataset.name)) r.classList.add("busy");
  });
  log(mode==="apply"?"info":"warn",
      (mode==="apply"?"开始破甲 · ":"开始还原 · ")+
      names.map(n=>LABEL1(n)).join("、"));
  try{
    const r = mode==="apply"? await api.apply(names) : await api.revert(names);
    if(r && r.need_consent){
      /* 条款记录被外部清掉了（另一个实例、手工删了 consent.json）。
         直接拉起条款面板，别让界面停在「准备中」等一个不存在的任务。 */
      S.busy=false; S.stage="";
      syncButtons();
      document.querySelectorAll(".row.busy").forEach(x=>x.classList.remove("busy"));
      log("warn", r.msg||"请先接受使用条款");
      toast(r.msg||"请先接受使用条款", true);
      /* 面板里已经有条款正文（boot() 首次渲染时就填好了），直接显示。
         再调 boot() 会白跑一次全目标探测，只为了拿一段不变的静态文案。 */
      openConsent(S.consentSections||[]);
      return;
    }
    if(r && r.need_update){
      // 后端拦下来的（前端状态可能是旧的，比如后台刚把强制更新打开）
      S.busy=false; S.stage="";
      syncButtons();
      document.querySelectorAll(".row.busy").forEach(x=>x.classList.remove("busy"));
      log("warn", r.msg||"需要先更新");
      toast(r.msg||"需要先更新", true);
      checkUpdate();
      return;
    }
    if(!r||r.ok===false) throw new Error((r&&r.msg)||"启动失败");
    pollLoop();
  }catch(e){
    S.busy=false; S.stage="";
    syncButtons();
    document.querySelectorAll(".row.busy").forEach(r=>r.classList.remove("busy"));
    log("bad","执行失败："+(e&&e.message||e));
    toast("执行失败，看日志",true);
  }
}
function LABEL1(n){
  const t=S.targets.find(x=>x.name===n); return t?t.label:(LABEL_OF[n]||n);
}

let pollTimer=null;
function pollLoop(){
  clearTimeout(pollTimer);
  const tick=async()=>{
    let r=null;
    try{ r=await api.poll(); }catch(e){}
    if(r){
      if(r.logs&&r.logs.length){
        for(const L of r.logs){
          if(L.i>=S.logCursor){ log(L.level||"info",L.text); S.logCursor=L.i+1; }
        }
      }
      if(typeof r.progress==="number"){
        S.progress=r.progress; S.stage=r.stage||S.stage; syncButtons();
      }
      if(r.done){
        S.busy=false; S.stage=""; S.progress=100;
        syncButtons();
        document.querySelectorAll(".row.busy").forEach(x=>x.classList.remove("busy"));
        const sum=r.summary||"";
        const res=(r.result&&typeof r.result==="object")?r.result:null;
        let allOk, partial=false;
        if(res&&typeof res.total==="number"&&res.total>0){
          // 后端给了结构化结果就只认它。summary 是给人看的话术，
          // 「完成 2/4，其余看日志」里没有「失败」两个字，靠字符串判断会把
          // 半成功当全成功，弹彩带庆祝一件没做完的事。
          allOk=!res.failed&&!res.partial&&res.ok===res.total;
          partial=!!res.partial;
        }else{
          // 老版本后端 / 极早退出没有 result，才退回字符串判断。
          allOk=sum.indexOf("失败")<0&&!!sum;
        }
        if(sum) log(allOk?"ok":(partial?"warn":"bad"), sum);
        if(allOk){ flashScreen(); toast(sum||"完成"); }
        else if(partial){ toast(sum||"有目标没做完，看日志",true); }
        else{ toast(sum||"有目标未完成",true); }
        setTimeout(()=>scan(false),280);
        return;
      }
    }
    pollTimer=setTimeout(tick,220);
  };
  pollTimer=setTimeout(tick,120);
}

let toastTimer=null;
function toast(msg,err){

function flashScreen(){
  const f=$("#flash");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  confetti();
}
function confetti(){
  const cv=$("#fx"), ctx=cv.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#ff5c3a","#ff9a4d","#3ddc97","#f5b942","#ffffff"];
  const ps=[];
  for(let i=0;i<46;i++){
    ps.push({x:innerWidth*(0.34+Math.random()*0.32),y:innerHeight*0.36,
      vx:(Math.random()-0.5)*9,vy:-Math.random()*11-5,
      s:2+Math.random()*3.5,c:cols[(Math.random()*cols.length)|0],
      a:Math.random()*6.28,va:(Math.random()-0.5)*0.3,life:1});
  }
  const t0=performance.now();
  const step=(t)=>{
    const dt=Math.min((t-t0)/1000,1.4);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let alive=false;
    for(const p of ps){
      p.vy+=26*0.016; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      p.life=Math.max(0,1-dt/1.3);
      if(p.y<innerHeight+30&&p.life>0){
        alive=true;
        ctx.save(); ctx.globalAlpha=p.life*0.95;
        ctx.translate(p.x,p.y); ctx.rotate(p.a);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.7);
        ctx.restore();
      }
    }
    if(alive&&dt<1.4) requestAnimationFrame(step);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  };
  requestAnimationFrame(step);
}

/* 注意函数名：以前这里也叫 doVerify，跟第 7 节那个「校验安装包」重名。
   JS 里后定义的会覆盖前一个，于是更新卡片的「校验文件」按钮实际跑的是
   体检 —— 用户点下去看到「体检通过」，还以为是安装包核验过了。
   体检改名 doHealth，按钮绑定见文件末尾。 */
async function doHealth(){
  if(S.busy) return;
  $("#logbox").classList.add("open");
  log("info","—— 体检（只看文件，不改动）");
  let r=null;
  try{ r=await api.verify(); }
  catch(e){ log("bad","体检失败："+(e&&e.message||e)); return; }
  /* 后端在条款没通过 / 强制更新期间返回空 targets + need_*。不拦的话下面
     循环一个都不跑，最后照样弹「体检通过」—— 等于告诉用户「全都正常」，
     其实一项都没查。 */
  if(r && (r.need_consent || r.need_update || r.need_license)){
    log("warn", r.msg || "请先接受使用条款");
    toast(r.msg || "体检没跑起来", true);
    return;
  }
  let bad=0, absent=0, checked=0;
  (r&&r.targets||[]).forEach(t=>{
    log(t.absent?"dim":"info",(t.absent?"  ":"—— ")+t.label+(t.absent?" 未安装":""));
    if(t.absent){ absent++; return; }
    (t.items||[]).forEach(it=>{
      checked++;
      log(it.ok?"ok":"bad",(it.ok?"  [ok] ":"  [!!] ")+it.text);
      if(!it.ok){ bad++; if(it.hint) log("dim","        "+it.hint); }
    });
  });
  // 一个都没查到就别说「通过」。4 个客户端全没装时，bad=0 会让界面
  // 弹一句「文件层面全对」—— 用户以为万事大吉，其实什么都没查。
  if(bad) toast(`体检：${bad} 项有问题`,true);
  else if(!checked) toast(absent?"这些客户端都没装，没有可查的东西":"没有可查的项目",true);
  else if(absent) toast(`体检通过 · 已查 ${checked} 项（${absent} 个未安装）`);
  else toast("体检通过 · 文件层面全对");
}

/* 标题栏拖动：自己算绝对坐标，用 SetWindowPos 挪（系统级拖动在无边框窗口上不生效） */
(function drag(){
  const bar=$("#titlebar");
  let st=null, raf=0, pend=null;

  const flush=()=>{
    raf=0;
    if(pend && st){ api.win_move(pend.x, pend.y); pend=null; }
  };

  bar.addEventListener("mousedown", async e=>{
    if(e.button!==0) return;
    if(e.target.closest("button")) return;

    // 先掐掉文本选择和默认拖拽：await 之后再做就晚了，鼠标已经拖出一段
    // 蓝色选区，而且窗口在动、选区留在原地，看着像花屏。
    e.preventDefault();

    // 记下按下时的屏幕坐标，不必等 win_pos 回来 —— 回来之前用户可能已经
    // 松开鼠标，那种情况下整个拖动就丢了。
    const down={sx:e.screenX, sy:e.screenY};

    let pos=null;
    try{ pos=await api.win_pos(); }catch(_){ return; }
    if(!pos || !pos.ok) return;

    // 窗口原点 = 当前位置 + 鼠标相对按下点移动的距离。
    // 用 pos 里的 x/y 当基准、down 当零点，不依赖 win_pos 什么时候返回。
    st={wx:pos.x, wy:pos.y, sx:down.sx, sy:down.sy};

    const mv=ev=>{
      if(!st) return;
      pend={
        x: st.wx + (ev.screenX - st.sx),
        y: st.wy + (ev.screenY - st.sy),
      };
      if(!raf) raf=requestAnimationFrame(flush);
    };
    const up=()=>{
      st=null; pend=null;
      if(raf){ cancelAnimationFrame(raf); raf=0; }
      removeEventListener("mousemove",mv);
      removeEventListener("mouseup",up);
    };
    addEventListener("mousemove",mv);
    addEventListener("mouseup",up);
  });
})();

function boot(){
  if(hasPywebview())      api = window.pywebview.api;
  else if(location.protocol.indexOf("http")===0) api = httpApi();
  else                    api = mockApi();
  // 条款面板先盖住。要不要摘掉，等 boot() 回信里 consent.accepted 决定。
  // 先盖后查：就算后端出异常，用户看到的也是条款而不是主界面。
  openConsent(null);
  log("dim","正在启动…");
  scan(true);
  loadWatch();
  // 版本检查：boot() 只给缓存 / 空壳，后台线程在打网络。这里 500ms 后
  // 开始取结果，取到就画更新卡。不能放在 scan() 之前 —— 那会让首屏多等。
  setTimeout(pollUpdate, 500);
}
if(hasPywebview()){
  boot();
}else{
  let done=false;
  const go=()=>{ if(done) return; done=true; boot(); };
  window.addEventListener("pywebviewready",go,{once:true});
  setTimeout(()=>{
    if(done) return;
    if(location.protocol.indexOf("http")===0){ go(); return; }
    go();
  },700);
}
</script>
</body>
