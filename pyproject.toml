[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoxiongmao"
version = "1.3.7"
description = "把一份人格文件装进本地 AI 客户端的配置里 — Codex / WorkBuddy / ZCode / DSH"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xiaoxiongmao contributors" }]
keywords = [
    "codex",
    "workbuddy",
    "zcode",
    "dsh",
    "persona",
    "instruction-injection",
    "prompt-engineering",
    "windows",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]

dependencies = [
    "cryptography>=41",
    "pywebview>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
xm = "xm:main"

[project.urls]
Homepage = "https://github.com/OWNER/xiaoxiongmao"
Repository = "https://github.com/OWNER/xiaoxiongmao"
Issues = "https://github.com/OWNER/xiaoxiongmao/issues"

[tool.setuptools]
packages = ["core"]
py-modules = ["app", "xm"]

[tool.setuptools.package-data]
core = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
