[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoxiongmao"
version = "1.3.8"
description = "小熊猫破甲（pojia）：一键破甲 Codex / WorkBuddy / ZCode / DSH 四个 AI 客户端的提示词，换成你自己写的人格。开源、离线、可随时还原。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Susie", email = "SusieCommons@users.noreply.github.com" }]
keywords = [
    "pojia",
    "xiaoxiongmao",
    "破甲",
    "codex",
    "workbuddy",
    "zcode",
    "dsh",
    "persona",
    "prompt-injection",
    "prompt-engineering",
    "windows",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Utilities",
]

dependencies = [
    "cryptography>=41",
    "pywebview>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
xm = "xm:main"

[project.urls]
Homepage = "https://github.com/SusieCommons/pojia-xm"
Repository = "https://github.com/SusieCommons/pojia-xm"
Issues = "https://github.com/SusieCommons/pojia-xm/issues"

[tool.setuptools]
packages = ["core"]
py-modules = ["app", "xm"]

[tool.setuptools.package-data]
core = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
