name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: 语法检查
        run: python -m compileall -q app.py xm.py core server bot tests

      - name: 测试
        run: python -m pytest tests/ -q

  clean:
    name: 仓库洁净度
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 门禁逻辑只有一份：tools/check_clean.py。
      # CI 只是调它，不在这里重写一套 grep —— 两套规则必然会漂。
      - name: 密钥 / 生产地址 / 本机路径 / 引流内容
        run: python tools/check_clean.py

      - name: 历史里也不能有
        run: python tools/check_clean.py --history
